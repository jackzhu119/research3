    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.96" y="10.798594" transform="rotate(-0 3.96 10.798594)">A  Matched calibration comparisons in five evaluation cohorts</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.9px; font-family: 'DejaVu Sans'" transform="translate(33.374761 54.83264)">Conventional CSP/LDA updates</text>
